name: finsentinel
description: FinSentinel — autonomous financial risk platform (mobile client).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.4.3

  # Secure token storage — see lib/core/auth/token_store.dart for why this
  # is non-negotiable over SharedPreferences.
  flutter_secure_storage: ^11.1.1

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  decimal: ^3.2.6

  # Local/offline persistence
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.3
  path: ^1.9.0
  connectivity_plus: ^7.3.1

  # State management
  flutter_riverpod: ^3.4.3

  # Utilities
  uuid: ^4.4.0
  intl: ^0.20.3
  collection: ^1.18.0

  # Charts (percentile bands, spending donut)
  fl_chart: ^1.2.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.4.9
  freezed: ^4.0.1
  json_serializable: ^6.8.0
  drift_dev: ^2.16.0

flutter:
  uses-material-design: true
