[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    integration: full-system tests against real Postgres/Redis/LLM (Step 19) -- slow, requires live infra, excluded from the default run.
# Plain `pytest` runs only the fast SQLite-backed unit suite. The
# integration suite (tests/integration/) makes real network calls (a
# live LLM, real Postgres, real Redis) and polls a real background
# consumer -- it belongs in a deliberate, separate invocation
# (`pytest -m integration tests/integration/`), never swept into the
# suite everyone runs on every change.
addopts = -m "not integration"
